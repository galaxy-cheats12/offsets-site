<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offsets — CS2 & Fortnite</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; margin: 0; }
        h1 { border-bottom: 1px solid #30363d; padding-bottom: .5rem; font-weight: 400; }
        .game-selector { margin-bottom: 1.5rem; display: flex; gap: 8px; }
        .game-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .game-btn:hover { background: #30363d; }
        .game-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        .meta { color: #8b949e; font-size: 0.9rem; margin-bottom: 1rem; min-height: 1.2em; }
        input[type="text"] { width: 100%; padding: 8px 12px; margin-bottom: 1rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 6px; overflow: hidden; }
        th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #30363d; }
        th { background: #21262d; font-weight: 600; color: #f0f6fc; }
        code { font-family: ui-monospace, monospace; background: #0d1117; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
        .note { color: #8b949e; font-size: 0.85rem; margin-top: 1rem; font-style: italic; }
    </style>
</head>
<body>
    <h1>Offsets</h1>
    <div class="game-selector" id="game-selector"></div>
    <div class="meta" id="status">Select a game.</div>
    <input type="text" id="search" placeholder="Filter..." oninput="filterRows()">
    <table>
        <thead><tr><th>Name</th><th>Value</th></tr></thead>
        <tbody id="offsets-body"></tbody>
    </table>
    <div class="note" id="note"></div>

    <script>
        const GAMES = {
            cs2: {
                name: 'CS2',
                url: 'https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/offsets.json',
                type: 'json',
                note: 'Source: a2x/cs2-dumper (auto-updated)'
            },
            fortnite: {
                name: 'Fortnite',
                // Route B: point at your Cloudflare Worker (see §4).
                // Route A: replace with the raw header URL and set type: 'fortnite-raw'.
                url: 'https://raw.githubusercontent.com/SternI/FortniteOffsets/main/Offsets/offsets.h',
                type: 'fortnite-raw',
                note: 'Source: SternI/FortniteOffsets (parsed from header)'
            }
        };

        let currentGame = 'cs2';

        function renderSelector() {
            const c = document.getElementById('game-selector'); c.innerHTML = '';
            Object.entries(GAMES).forEach(([k, g]) => {
                const b = document.createElement('button');
                b.className = 'game-btn' + (k === currentGame ? ' active' : '');
                b.textContent = g.name;
                b.onclick = () => { currentGame = k; renderSelector(); load(); };
                c.appendChild(b);
            });
        }

        function filterRows() {
            const q = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#offsets-body tr').forEach(r => {
                r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        function row(name, value) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><code>${name}</code></td><td><code>${value}</code></td>`;
            return tr;
        }

        async function load() {
            const status = document.getElementById('status');
            const tbody = document.getElementById('offsets-body');
            const note = document.getElementById('note');
            const g = GAMES[currentGame];

            tbody.innerHTML = ''; note.textContent = g.note || '';
            document.getElementById('search').value = '';

            status.textContent = `Loading ${g.name}...`;
            try {
                const res = await fetch(g.url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();

                if (g.type === 'json') {
                    const data = JSON.parse(text);
                    Object.entries(data).sort((a, b) => a[0].localeCompare(b[0]))
                        .forEach(([k, v]) => tbody.appendChild(row(k, `0x${Number(v).toString(16).toUpperCase()}`)));
                    status.textContent = `${g.name}: ${Object.keys(data).length} offsets`;
                } else if (g.type === 'fortnite-raw') {
                    // Parse C++ header: look for patterns like "Name = 0xVALUE" or "Name = VALUE"
                    const matches = [...text.matchAll(/(\w+)\s*=\s*(0x[0-9A-Fa-f]+|\d+)/g)];
                    if (matches.length === 0) throw new Error('No offset patterns found in header');
                    matches.sort((a, b) => a[1].localeCompare(b[1]))
                        .forEach(m => tbody.appendChild(row(m[1], m[2])));
                    status.textContent = `${g.name}: ${matches.length} offsets parsed`;
                }
            } catch (e) {
                status.textContent = `${g.name}: failed (${e.message})`;
            }
        }

        renderSelector();
        load();
    </script>
</body>
</html>
